<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Hiragana & Katakana — 日本語</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=Shippori+Mincho:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0c0b10;
      --surface: rgba(28, 26, 38, 0.85);
      --surface2: rgba(38, 35, 52, 0.9);
      --border: rgba(255, 255, 255, 0.08);
      --border-glow: rgba(232, 160, 180, 0.25);
      --text: #f5f0eb;
      --text-muted: #a89f96;
      --accent: #e8a0b4;
      --accent-soft: #f0c4d0;
      --accent-deep: #c97b8e;
      --gold: #d4af77;
      --gold-soft: #e8d5b5;
      --success: #7dcea0;
      --error: #e07a7a;
      --radius: 16px;
      --shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
      --transition: 0.35s cubic-bezier(0.22, 1, 0.36, 1);
      --jp-font: 'Shippori Mincho', serif;
      --normal-font: 'Noto Sans JP', system-ui, sans-serif;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: var(--normal-font);
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
    }

    body.use-jp-font .char,
    body.use-jp-font .big-char,
    body.use-jp-font .write-target,
    body.use-jp-font .quiz-char,
    body.use-jp-font .start-title,
    body.use-jp-font .choice-card .big {
      font-family: var(--jp-font);
    }

    .bg-pattern {
      position: fixed;
      inset: 0;
      z-index: -2;
      background:
        radial-gradient(ellipse 80% 50% at 20% 20%, rgba(232, 160, 180, 0.07) 0%, transparent 50%),
        radial-gradient(ellipse 60% 40% at 80% 80%, rgba(212, 175, 119, 0.05) 0%, transparent 50%),
        radial-gradient(ellipse 50% 30% at 50% 50%, rgba(120, 90, 160, 0.04) 0%, transparent 60%),
        var(--bg);
    }

    .bg-pattern::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='none' fill-rule='evenodd'%3E%3Cg fill='%23e8a0b4' fill-opacity='0.03'%3E%3Cpath d='M36 34v-4h-2v4h-4v2h4v4h2v-4h4v-2h-4zm0-30V0h-2v4h-4v2h4v4h2V6h4V4h-4zM6 34v-4H4v4H0v2h4v4h2v-4h4v-2H6zM6 4V0H4v4H0v2h4v4h2V6h4V4H6z'/%3E%3C/g%3E%3C/g%3E%3C/svg%3E");
      opacity: 0.6;
    }

    .petal {
      position: fixed;
      width: 10px;
      height: 10px;
      background: radial-gradient(ellipse at 30% 30%, #f0c4d0, #e8a0b4);
      border-radius: 10px 0 10px 0;
      opacity: 0.35;
      pointer-events: none;
      z-index: -1;
      animation: fall linear infinite;
    }

    @keyframes fall {
      0% { transform: translateY(-10vh) rotate(0deg) translateX(0); opacity: 0; }
      10% { opacity: 0.4; }
      90% { opacity: 0.3; }
      100% { transform: translateY(110vh) rotate(720deg) translateX(40px); opacity: 0; }
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      padding: 20px 16px 40px;
      position: relative;
    }

    /* ========== EKRAN STARTOWY ========== */
    #startScreen {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      animation: fadeUp 0.8s var(--transition) both;
    }

    #startScreen.hidden { display: none; }

    .start-title {
      font-size: 2.4rem;
      font-weight: 500;
      letter-spacing: 0.06em;
      background: linear-gradient(135deg, var(--accent-soft), var(--gold-soft));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 8px;
    }

    .start-jp {
      font-size: 1rem;
      color: var(--text-muted);
      letter-spacing: 0.35em;
      margin-bottom: 12px;
      font-weight: 300;
    }

    .start-desc {
      color: var(--text-muted);
      font-size: 0.95rem;
      margin-bottom: 40px;
      font-weight: 300;
    }

    .choice-cards {
      display: flex;
      gap: 24px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .choice-card {
      width: 220px;
      padding: 36px 24px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.22, 1, 0.36, 1);
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
      text-align: center;
    }

    .choice-card:hover {
      transform: translateY(-8px) scale(1.03);
      border-color: var(--accent);
      box-shadow: 0 16px 40px rgba(232, 160, 180, 0.25);
    }

    .choice-card .big {
      font-size: 3.2rem;
      margin-bottom: 12px;
      display: block;
      transition: transform 0.3s;
    }

    .choice-card:hover .big {
      transform: scale(1.1);
      color: var(--accent-soft);
    }

    .choice-card h2 {
      font-size: 1.3rem;
      font-weight: 500;
      margin-bottom: 6px;
    }

    .choice-card p {
      font-size: 0.85rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    /* ========== GŁÓWNY INTERFEJS ========== */
    #mainApp {
      display: none;
      animation: fadeUp 0.6s var(--transition) both;
    }

    #mainApp.visible { display: block; }

    .top-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 16px;
      border-bottom: 1px solid var(--border);
    }

    .back-btn {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      transition: all 0.25s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .back-btn:hover {
      border-color: var(--accent);
      color: var(--accent-soft);
    }

    .current-script-label {
      font-size: 1.15rem;
      font-weight: 500;
      color: var(--accent-soft);
      letter-spacing: 0.04em;
    }

    .font-toggle {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.82rem;
      color: var(--text-muted);
      cursor: pointer;
      user-select: none;
    }

    .font-toggle input {
      accent-color: var(--accent);
      width: 16px;
      height: 16px;
      cursor: pointer;
    }

    .font-toggle:hover { color: var(--text); }

    .mode-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .mode-tab {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 9px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all var(--transition);
      backdrop-filter: blur(8px);
    }

    .mode-tab:hover {
      border-color: var(--border-glow);
      color: var(--text);
      transform: translateY(-2px);
    }

    .mode-tab.active {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      border-color: transparent;
      color: #1a1215;
      box-shadow: 0 4px 16px rgba(232, 160, 180, 0.3);
    }

    .category-tabs {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 14px;
    }

    .cat-tab {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 8px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.88rem;
      font-weight: 500;
      transition: all 0.25s;
    }

    .cat-tab:hover {
      border-color: var(--accent);
      color: var(--accent-soft);
    }

    .cat-tab.active {
      background: rgba(232, 160, 180, 0.15);
      border-color: var(--accent);
      color: var(--accent-soft);
      box-shadow: 0 0 14px rgba(232, 160, 180, 0.12);
    }

    .row-filters {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      justify-content: center;
      margin-bottom: 20px;
      min-height: 36px;
    }

    .row-btn {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.78rem;
      transition: all 0.25s ease;
    }

    .row-btn:hover {
      border-color: var(--accent);
      color: var(--accent-soft);
      background: rgba(232, 160, 180, 0.08);
    }

    .row-btn.active {
      background: rgba(232, 160, 180, 0.18);
      border-color: var(--accent);
      color: var(--accent-soft);
      box-shadow: 0 0 12px rgba(232, 160, 180, 0.15);
    }

    .chart-container {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      overflow-x: auto;
      backdrop-filter: blur(16px);
      box-shadow: var(--shadow);
    }

    .chart-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      min-width: 300px;
    }

    .chart-cell {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 14px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      user-select: none;
      position: relative;
      overflow: hidden;
    }

    .chart-cell::after {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(232,160,180,0.12), transparent 60%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .chart-cell:hover {
      border-color: var(--accent);
      transform: translateY(-4px) scale(1.03);
      box-shadow: 0 8px 24px rgba(232, 160, 180, 0.2);
    }

    .chart-cell:hover::after { opacity: 1; }

    .chart-cell.empty {
      background: transparent;
      border: none;
      cursor: default;
    }

    .chart-cell.empty:hover { transform: none; box-shadow: none; }

    .char {
      font-size: 1.95rem;
      font-weight: 500;
      display: block;
      margin-bottom: 3px;
      transition: transform 0.3s, color 0.3s;
    }

    .chart-cell:hover .char {
      transform: scale(1.08);
      color: var(--accent-soft);
    }

    .romaji {
      font-size: 0.72rem;
      color: var(--text-muted);
      letter-spacing: 0.02em;
    }

    .sound-btn {
      position: absolute;
      top: 5px;
      right: 5px;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 0.7rem;
      cursor: pointer;
      opacity: 0;
      transition: all 0.25s;
      padding: 3px;
      z-index: 2;
    }

    .chart-cell:hover .sound-btn { opacity: 0.7; }
    .sound-btn:hover { opacity: 1 !important; color: var(--accent); transform: scale(1.2); }

    .flashcard-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .flashcard {
      width: 270px;
      height: 320px;
      perspective: 1200px;
      cursor: pointer;
    }

    .flashcard-inner {
      width: 100%;
      height: 100%;
      position: relative;
      transition: transform 0.7s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }

    .flashcard.flipped .flashcard-inner { transform: rotateY(180deg); }

    .flashcard-front, .flashcard-back {
      position: absolute;
      width: 100%;
      height: 100%;
      backface-visibility: hidden;
      border-radius: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .flashcard-front {
      background: linear-gradient(160deg, #1c1a26 0%, #252230 100%);
    }

    .flashcard-front::before {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: radial-gradient(circle, rgba(232,160,180,0.08) 0%, transparent 50%);
      animation: pulse 6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.5; }
      50% { transform: scale(1.1); opacity: 0.8; }
    }

    .flashcard-back {
      background: linear-gradient(160deg, #2a2538 0%, #322c42 100%);
      transform: rotateY(180deg);
    }

    .flashcard .big-char {
      font-size: 5.5rem;
      font-weight: 500;
      position: relative;
      z-index: 1;
      text-shadow: 0 4px 30px rgba(232, 160, 180, 0.25);
    }

    .flashcard .big-romaji {
      font-size: 2.1rem;
      color: var(--accent);
      font-weight: 500;
      letter-spacing: 0.05em;
    }

    .flashcard-hint {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 14px;
      font-weight: 300;
      position: relative;
      z-index: 1;
    }

    .flash-controls, .write-controls, .quiz-controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
      backdrop-filter: blur(8px);
    }

    .btn:hover {
      border-color: var(--accent);
      background: rgba(232, 160, 180, 0.1);
      transform: translateY(-2px);
      box-shadow: 0 6px 18px rgba(232, 160, 180, 0.15);
    }

    .btn.primary {
      background: linear-gradient(135deg, var(--accent-deep), var(--accent));
      border-color: transparent;
      color: #1a1215;
      box-shadow: 0 4px 16px rgba(232, 160, 180, 0.3);
    }

    .btn.primary:hover {
      box-shadow: 0 8px 24px rgba(232, 160, 180, 0.4);
      transform: translateY(-2px);
    }

    .btn.sound {
      background: rgba(255,255,255,0.04);
      font-size: 1.15rem;
      padding: 10px 14px;
    }

    .quiz-area {
      max-width: 460px;
      margin: 0 auto;
      text-align: center;
    }

    .quiz-char {
      font-size: 5.8rem;
      margin: 18px 0;
      font-weight: 500;
      text-shadow: 0 4px 40px rgba(232, 160, 180, 0.3);
      animation: charPop 0.5s cubic-bezier(0.22, 1, 0.36, 1);
    }

    @keyframes charPop {
      from { opacity: 0; transform: scale(0.85); }
      to { opacity: 1; transform: scale(1); }
    }

    .quiz-options {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin: 18px 0;
    }

    .quiz-option {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 14px;
      border-radius: 12px;
      cursor: pointer;
      font-size: 1.05rem;
      font-weight: 500;
      transition: all 0.3s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .quiz-option:hover {
      border-color: var(--accent);
      transform: translateY(-3px);
      box-shadow: 0 6px 18px rgba(232, 160, 180, 0.18);
    }

    .quiz-option.correct {
      background: linear-gradient(135deg, #5a9e78, var(--success));
      border-color: transparent;
      color: #0a1a10;
      animation: correctPulse 0.4s ease;
    }

    .quiz-option.wrong {
      background: linear-gradient(135deg, #b85c5c, var(--error));
      border-color: transparent;
      color: white;
      animation: shake 0.4s ease;
    }

    @keyframes correctPulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.05); }
      100% { transform: scale(1); }
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-6px); }
      75% { transform: translateX(6px); }
    }

    .quiz-input-area { margin: 16px 0; }

    .quiz-input {
      width: 100%;
      max-width: 240px;
      padding: 13px 18px;
      font-size: 1.2rem;
      text-align: center;
      background: var(--surface2);
      border: 2px solid var(--border);
      border-radius: 12px;
      color: var(--text);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      font-family: inherit;
    }

    .quiz-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(232, 160, 180, 0.15);
    }

    .quiz-stats {
      display: flex;
      justify-content: center;
      gap: 22px;
      margin-top: 14px;
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    .quiz-stats span strong { color: var(--text); font-weight: 500; }

    .feedback {
      min-height: 28px;
      font-size: 0.95rem;
      font-weight: 500;
      margin-top: 12px;
    }

    .feedback.ok { color: var(--success); }
    .feedback.bad { color: var(--error); }

    .progress-bar-wrap {
      max-width: 360px;
      margin: 14px auto 0;
      height: 6px;
      background: rgba(255,255,255,0.06);
      border-radius: 3px;
      overflow: hidden;
    }

    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, var(--accent-deep), var(--gold));
      width: 0%;
      transition: width 0.5s cubic-bezier(0.22, 1, 0.36, 1);
      border-radius: 3px;
    }

    .write-area {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .write-target {
      font-size: 3.8rem;
      font-weight: 500;
      text-shadow: 0 4px 30px rgba(232, 160, 180, 0.25);
    }

    .write-romaji {
      color: var(--text-muted);
      font-size: 1.1rem;
      letter-spacing: 0.05em;
    }

    #writeCanvas {
      background: linear-gradient(160deg, #16141f, #1c1a26);
      border: 1px solid var(--border);
      border-radius: 16px;
      touch-action: none;
      cursor: crosshair;
      max-width: 100%;
      box-shadow: var(--shadow);
      transition: border-color 0.3s;
    }

    #writeCanvas:hover { border-color: var(--border-glow); }

    .write-hint {
      font-size: 0.8rem;
      color: var(--text-muted);
      font-weight: 300;
    }

    .settings-row {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-bottom: 14px;
      flex-wrap: wrap;
      align-items: center;
    }

    .toggle-label {
      display: flex;
      align-items: center;
      gap: 7px;
      font-size: 0.84rem;
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.2s;
    }

    .toggle-label:hover { color: var(--text); }

    .toggle-label input {
      accent-color: var(--accent);
      width: 15px;
      height: 15px;
    }

    .hidden { display: none !important; }

    .hard-badge {
      display: inline-block;
      background: linear-gradient(135deg, #c45c5c, var(--error));
      color: white;
      font-size: 0.6rem;
      padding: 1px 5px;
      border-radius: 4px;
      margin-left: 3px;
      vertical-align: middle;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @media (max-width: 600px) {
      .start-title { font-size: 1.9rem; }
      .choice-card { width: 160px; padding: 28px 16px; }
      .choice-card .big { font-size: 2.6rem; }
      .char { font-size: 1.55rem; }
      .flashcard { width: 240px; height: 290px; }
      .flashcard .big-char { font-size: 4.5rem; }
      .quiz-char { font-size: 4.5rem; }
      .quiz-options { grid-template-columns: 1fr; }
      .write-target { font-size: 3rem; }
      .top-bar { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <div class="petal" style="left:10%; animation-duration:12s; animation-delay:0s;"></div>
  <div class="petal" style="left:25%; animation-duration:15s; animation-delay:2s; width:8px; height:8px;"></div>
  <div class="petal" style="left:45%; animation-duration:11s; animation-delay:4s;"></div>
  <div class="petal" style="left:60%; animation-duration:14s; animation-delay:1s; width:12px; height:12px;"></div>
  <div class="petal" style="left:75%; animation-duration:13s; animation-delay:3s;"></div>
  <div class="petal" style="left:85%; animation-duration:16s; animation-delay:5s; width:7px; height:7px;"></div>
  <div class="petal" style="left:15%; animation-duration:18s; animation-delay:7s;"></div>
  <div class="petal" style="left:55%; animation-duration:10s; animation-delay:6s; width:9px; height:9px;"></div>

  <script>
    const HIRAGANA = [
      {char:'あ', romaji:'a', row:'a', cat:'basic'}, {char:'い', romaji:'i', row:'a', cat:'basic'}, {char:'う', romaji:'u', row:'a', cat:'basic'}, {char:'え', romaji:'e', row:'a', cat:'basic'}, {char:'お', romaji:'o', row:'a', cat:'basic'},
      {char:'か', romaji:'ka', row:'ka', cat:'basic'}, {char:'き', romaji:'ki', row:'ka', cat:'basic'}, {char:'く', romaji:'ku', row:'ka', cat:'basic'}, {char:'け', romaji:'ke', row:'ka', cat:'basic'}, {char:'こ', romaji:'ko', row:'ka', cat:'basic'},
      {char:'さ', romaji:'sa', row:'sa', cat:'basic'}, {char:'し', romaji:'shi', row:'sa', cat:'basic'}, {char:'す', romaji:'su', row:'sa', cat:'basic'}, {char:'せ', romaji:'se', row:'sa', cat:'basic'}, {char:'そ', romaji:'so', row:'sa', cat:'basic'},
      {char:'た', romaji:'ta', row:'ta', cat:'basic'}, {char:'ち', romaji:'chi', row:'ta', cat:'basic'}, {char:'つ', romaji:'tsu', row:'ta', cat:'basic'}, {char:'て', romaji:'te', row:'ta', cat:'basic'}, {char:'と', romaji:'to', row:'ta', cat:'basic'},
      {char:'な', romaji:'na', row:'na', cat:'basic'}, {char:'に', romaji:'ni', row:'na', cat:'basic'}, {char:'ぬ', romaji:'nu', row:'na', cat:'basic'}, {char:'ね', romaji:'ne', row:'na', cat:'basic'}, {char:'の', romaji:'no', row:'na', cat:'basic'},
      {char:'は', romaji:'ha', row:'ha', cat:'basic'}, {char:'ひ', romaji:'hi', row:'ha', cat:'basic'}, {char:'ふ', romaji:'fu', row:'ha', cat:'basic'}, {char:'へ', romaji:'he', row:'ha', cat:'basic'}, {char:'ほ', romaji:'ho', row:'ha', cat:'basic'},
      {char:'ま', romaji:'ma', row:'ma', cat:'basic'}, {char:'み', romaji:'mi', row:'ma', cat:'basic'}, {char:'む', romaji:'mu', row:'ma', cat:'basic'}, {char:'め', romaji:'me', row:'ma', cat:'basic'}, {char:'も', romaji:'mo', row:'ma', cat:'basic'},
      {char:'や', romaji:'ya', row:'ya', cat:'basic'}, {char:'', romaji:'', row:'ya', cat:'basic'}, {char:'ゆ', romaji:'yu', row:'ya', cat:'basic'}, {char:'', romaji:'', row:'ya', cat:'basic'}, {char:'よ', romaji:'yo', row:'ya', cat:'basic'},
      {char:'ら', romaji:'ra', row:'ra', cat:'basic'}, {char:'り', romaji:'ri', row:'ra', cat:'basic'}, {char:'る', romaji:'ru', row:'ra', cat:'basic'}, {char:'れ', romaji:'re', row:'ra', cat:'basic'}, {char:'ろ', romaji:'ro', row:'ra', cat:'basic'},
      {char:'わ', romaji:'wa', row:'wa', cat:'basic'}, {char:'', romaji:'', row:'wa', cat:'basic'}, {char:'', romaji:'', row:'wa', cat:'basic'}, {char:'', romaji:'', row:'wa', cat:'basic'}, {char:'を', romaji:'wo', row:'wa', cat:'basic'},
      {char:'ん', romaji:'n', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'},
      {char:'が', romaji:'ga', row:'ga', cat:'extra'}, {char:'ぎ', romaji:'gi', row:'ga', cat:'extra'}, {char:'ぐ', romaji:'gu', row:'ga', cat:'extra'}, {char:'げ', romaji:'ge', row:'ga', cat:'extra'}, {char:'ご', romaji:'go', row:'ga', cat:'extra'},
      {char:'ざ', romaji:'za', row:'za', cat:'extra'}, {char:'じ', romaji:'ji', row:'za', cat:'extra'}, {char:'ず', romaji:'zu', row:'za', cat:'extra'}, {char:'ぜ', romaji:'ze', row:'za', cat:'extra'}, {char:'ぞ', romaji:'zo', row:'za', cat:'extra'},
      {char:'だ', romaji:'da', row:'da', cat:'extra'}, {char:'ぢ', romaji:'ji', row:'da', cat:'extra'}, {char:'づ', romaji:'zu', row:'da', cat:'extra'}, {char:'で', romaji:'de', row:'da', cat:'extra'}, {char:'ど', romaji:'do', row:'da', cat:'extra'},
      {char:'ば', romaji:'ba', row:'ba', cat:'extra'}, {char:'び', romaji:'bi', row:'ba', cat:'extra'}, {char:'ぶ', romaji:'bu', row:'ba', cat:'extra'}, {char:'べ', romaji:'be', row:'ba', cat:'extra'}, {char:'ぼ', romaji:'bo', row:'ba', cat:'extra'},
      {char:'ぱ', romaji:'pa', row:'pa', cat:'extra'}, {char:'ぴ', romaji:'pi', row:'pa', cat:'extra'}, {char:'ぷ', romaji:'pu', row:'pa', cat:'extra'}, {char:'ぺ', romaji:'pe', row:'pa', cat:'extra'}, {char:'ぽ', romaji:'po', row:'pa', cat:'extra'},
    ];

    const KATAKANA = [
      {char:'ア', romaji:'a', row:'a', cat:'basic'}, {char:'イ', romaji:'i', row:'a', cat:'basic'}, {char:'ウ', romaji:'u', row:'a', cat:'basic'}, {char:'エ', romaji:'e', row:'a', cat:'basic'}, {char:'オ', romaji:'o', row:'a', cat:'basic'},
      {char:'カ', romaji:'ka', row:'ka', cat:'basic'}, {char:'キ', romaji:'ki', row:'ka', cat:'basic'}, {char:'ク', romaji:'ku', row:'ka', cat:'basic'}, {char:'ケ', romaji:'ke', row:'ka', cat:'basic'}, {char:'コ', romaji:'ko', row:'ka', cat:'basic'},
      {char:'サ', romaji:'sa', row:'sa', cat:'basic'}, {char:'シ', romaji:'shi', row:'sa', cat:'basic'}, {char:'ス', romaji:'su', row:'sa', cat:'basic'}, {char:'セ', romaji:'se', row:'sa', cat:'basic'}, {char:'ソ', romaji:'so', row:'sa', cat:'basic'},
      {char:'タ', romaji:'ta', row:'ta', cat:'basic'}, {char:'チ', romaji:'chi', row:'ta', cat:'basic'}, {char:'ツ', romaji:'tsu', row:'ta', cat:'basic'}, {char:'テ', romaji:'te', row:'ta', cat:'basic'}, {char:'ト', romaji:'to', row:'ta', cat:'basic'},
      {char:'ナ', romaji:'na', row:'na', cat:'basic'}, {char:'ニ', romaji:'ni', row:'na', cat:'basic'}, {char:'ヌ', romaji:'nu', row:'na', cat:'basic'}, {char:'ネ', romaji:'ne', row:'na', cat:'basic'}, {char:'ノ', romaji:'no', row:'na', cat:'basic'},
      {char:'ハ', romaji:'ha', row:'ha', cat:'basic'}, {char:'ヒ', romaji:'hi', row:'ha', cat:'basic'}, {char:'フ', romaji:'fu', row:'ha', cat:'basic'}, {char:'ヘ', romaji:'he', row:'ha', cat:'basic'}, {char:'ホ', romaji:'ho', row:'ha', cat:'basic'},
      {char:'マ', romaji:'ma', row:'ma', cat:'basic'}, {char:'ミ', romaji:'mi', row:'ma', cat:'basic'}, {char:'ム', romaji:'mu', row:'ma', cat:'basic'}, {char:'メ', romaji:'me', row:'ma', cat:'basic'}, {char:'モ', romaji:'mo', row:'ma', cat:'basic'},
      {char:'ヤ', romaji:'ya', row:'ya', cat:'basic'}, {char:'', romaji:'', row:'ya', cat:'basic'}, {char:'ユ', romaji:'yu', row:'ya', cat:'basic'}, {char:'', romaji:'', row:'ya', cat:'basic'}, {char:'ヨ', romaji:'yo', row:'ya', cat:'basic'},
      {char:'ラ', romaji:'ra', row:'ra', cat:'basic'}, {char:'リ', romaji:'ri', row:'ra', cat:'basic'}, {char:'ル', romaji:'ru', row:'ra', cat:'basic'}, {char:'レ', romaji:'re', row:'ra', cat:'basic'}, {char:'ロ', romaji:'ro', row:'ra', cat:'basic'},
      {char:'ワ', romaji:'wa', row:'wa', cat:'basic'}, {char:'', romaji:'', row:'wa', cat:'basic'}, {char:'', romaji:'', row:'wa', cat:'basic'}, {char:'', romaji:'', row:'wa', cat:'basic'}, {char:'ヲ', romaji:'wo', row:'wa', cat:'basic'},
      {char:'ン', romaji:'n', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'}, {char:'', romaji:'', row:'n', cat:'basic'},
      {char:'ガ', romaji:'ga', row:'ga', cat:'extra'}, {char:'ギ', romaji:'gi', row:'ga', cat:'extra'}, {char:'グ', romaji:'gu', row:'ga', cat:'extra'}, {char:'ゲ', romaji:'ge', row:'ga', cat:'extra'}, {char:'ゴ', romaji:'go', row:'ga', cat:'extra'},
      {char:'ザ', romaji:'za', row:'za', cat:'extra'}, {char:'ジ', romaji:'ji', row:'za', cat:'extra'}, {char:'ズ', romaji:'zu', row:'za', cat:'extra'}, {char:'ゼ', romaji:'ze', row:'za', cat:'extra'}, {char:'ゾ', romaji:'zo', row:'za', cat:'extra'},
      {char:'ダ', romaji:'da', row:'da', cat:'extra'}, {char:'ヂ', romaji:'ji', row:'da', cat:'extra'}, {char:'ヅ', romaji:'zu', row:'da', cat:'extra'}, {char:'デ', romaji:'de', row:'da', cat:'extra'}, {char:'ド', romaji:'do', row:'da', cat:'extra'},
      {char:'バ', romaji:'ba', row:'ba', cat:'extra'}, {char:'ビ', romaji:'bi', row:'ba', cat:'extra'}, {char:'ブ', romaji:'bu', row:'ba', cat:'extra'}, {char:'ベ', romaji:'be', row:'ba', cat:'extra'}, {char:'ボ', romaji:'bo', row:'ba', cat:'extra'},
      {char:'パ', romaji:'pa', row:'pa', cat:'extra'}, {char:'ピ', romaji:'pi', row:'pa', cat:'extra'}, {char:'プ', romaji:'pu', row:'pa', cat:'extra'}, {char:'ペ', romaji:'pe', row:'pa', cat:'extra'}, {char:'ポ', romaji:'po', row:'pa', cat:'extra'},
    ];

    const HARD_ROMAJI = new Set([
      'shi','chi','tsu','su','fu','n','wo','ji','zu','wa','ra','ri','ru','re','ro',
      'sa','za','ta','da','ha','ba','pa','hi','bi','pi'
    ]);

    const BASIC_ROWS = [
      {id:'all', label:'Wszystkie'},
      {id:'a', label:'あ行'},
      {id:'ka', label:'か行'},
      {id:'sa', label:'さ行'},
      {id:'ta', label:'た行'},
      {id:'na', label:'な行'},
      {id:'ha', label:'は行'},
      {id:'ma', label:'ま行'},
      {id:'ya', label:'や行'},
      {id:'ra', label:'ら行'},
      {id:'wa', label:'わ行'},
      {id:'n', label:'ん'},
    ];

    const EXTRA_ROWS = [
      {id:'all', label:'Wszystkie'},
      {id:'ga', label:'が行'},
      {id:'za', label:'ざ行'},
      {id:'da', label:'だ行'},
      {id:'ba', label:'ば行'},
      {id:'pa', label:'ぱ行'},
    ];

    let currentScript = 'hiragana';
    let currentMode = 'chart';
    let currentCat = 'basic';
    let activeRows = new Set(['all']);
    let flashIndex = 0;
    let flashDeck = [];
    let writeIndex = 0;
    let writeDeck = [];
    let quizCorrect = 0;
    let quizWrong = 0;
    let quizAnswered = false;
    let currentQuizItem = null;

    const savedFont = localStorage.getItem('hk_jp_font') === '1';
    if (savedFont) {
      document.body.classList.add('use-jp-font');
    }

    function getHardStats() {
      try { return JSON.parse(localStorage.getItem('hk_hard') || '{}'); }
      catch { return {}; }
    }

    function markHard(romaji, wasWrong) {
      const stats = getHardStats();
      if (!stats[romaji]) stats[romaji] = { wrong: 0, total: 0 };
      stats[romaji].total++;
      if (wasWrong) stats[romaji].wrong++;
      localStorage.setItem('hk_hard', JSON.stringify(stats));
    }

    function isHard(romaji) {
      if (HARD_ROMAJI.has(romaji)) return true;
      const stats = getHardStats();
      const s = stats[romaji];
      if (!s || s.total < 3) return false;
      return (s.wrong / s.total) >= 0.4;
    }

    function speak(text) {
      if (!window.speechSynthesis) return;
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      u.lang = 'ja-JP';
      u.rate = 0.85;
      const voices = speechSynthesis.getVoices();
      const ja = voices.find(v => v.lang.startsWith('ja'));
      if (ja) u.voice = ja;
      speechSynthesis.speak(u);
    }

    if (window.speechSynthesis) {
      speechSynthesis.getVoices();
      speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
    }

    function getData() {
      return currentScript === 'hiragana' ? HIRAGANA : KATAKANA;
    }

    function getFilteredData(includeEmpty = false) {
      let data = getData();

      if (currentCat === 'hard') {
        data = data.filter(d => d.char && isHard(d.romaji));
      } else {
        data = data.filter(d => d.cat === currentCat);
      }

      if (!activeRows.has('all') && currentCat !== 'hard') {
        data = data.filter(d => activeRows.has(d.row));
      }

      return includeEmpty ? data : data.filter(d => d.char !== '');
    }

    function shuffle(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    function renderRowFilters() {
      const container = document.getElementById('rowFilters');
      container.innerHTML = '';

      if (currentCat === 'hard') {
        container.innerHTML = '<span style="color:var(--text-muted);font-size:0.85rem;">Pokazuje znaki, które sprawiają Ci najwięcej trudności</span>';
        return;
      }

      const rows = currentCat === 'basic' ? BASIC_ROWS : EXTRA_ROWS;

      rows.forEach(r => {
        const btn = document.createElement('button');
        btn.className = 'row-btn' + (activeRows.has(r.id) ? ' active' : '');
        btn.textContent = r.label;
        btn.onclick = () => {
          if (r.id === 'all') {
            activeRows = new Set(['all']);
          } else {
            activeRows.delete('all');
            if (activeRows.has(r.id)) {
              activeRows.delete(r.id);
              if (activeRows.size === 0) activeRows.add('all');
            } else {
              activeRows.add(r.id);
            }
          }
          renderRowFilters();
          refreshCurrentMode();
        };
        container.appendChild(btn);
      });
    }

    function refreshCurrentMode() {
      if (currentMode === 'chart') renderChart();
      else if (currentMode === 'flashcards') initFlashcards();
      else if (currentMode === 'quiz') nextQuiz();
      else if (currentMode === 'write') initWrite();
    }

    function renderChart() {
      const grid = document.getElementById('chartGrid');
      grid.innerHTML = '';
      const data = getFilteredData(true);
      const showEmpty = activeRows.has('all') && currentCat !== 'hard';

      data.forEach(item => {
        const cell = document.createElement('div');
        if (!item.char) {
          if (!showEmpty) return;
          cell.className = 'chart-cell empty';
        } else {
          cell.className = 'chart-cell';
          const hard = isHard(item.romaji) ? '<span class="hard-badge">★</span>' : '';
          cell.innerHTML = `
            <button class="sound-btn" title="Dźwięk">🔊</button>
            <span class="char">${item.char}</span>
            <span class="romaji">${item.romaji}${hard}</span>
          `;
          cell.querySelector('.sound-btn').onclick = (e) => {
            e.stopPropagation();
            speak(item.char);
          };
          cell.onclick = () => speak(item.char);
        }
        grid.appendChild(cell);
      });
    }

    function initFlashcards() {
      flashDeck = shuffle(getFilteredData());
      flashIndex = 0;
      if (flashDeck.length === 0) {
        document.getElementById('flashChar').textContent = '–';
        document.getElementById('flashRomaji').textContent = 'Brak znaków';
        document.getElementById('flashTotal').textContent = '0';
        return;
      }
      showFlashcard();
    }

    function showFlashcard() {
      if (flashDeck.length === 0) return;
      const item = flashDeck[flashIndex];
      const showRomajiFirst = document.getElementById('showRomajiFirst').checked;
      const card = document.getElementById('flashcard');
      card.classList.remove('flipped');

      if (showRomajiFirst) {
        document.getElementById('flashChar').textContent = item.romaji;
        document.getElementById('flashRomaji').textContent = item.char;
      } else {
        document.getElementById('flashChar').textContent = item.char;
        document.getElementById('flashRomaji').textContent = item.romaji;
      }

      document.getElementById('flashIndex').textContent = flashIndex + 1;
      document.getElementById('flashTotal').textContent = flashDeck.length;

      if (document.getElementById('autoSpeak').checked) {
        setTimeout(() => speak(item.char), 250);
      }
    }

    function nextQuiz() {
      const data = getFilteredData();
      if (data.length === 0) {
        document.getElementById('quizChar').textContent = '–';
        document.getElementById('quizChoice').innerHTML = '';
        document.getElementById('quizFeedback').textContent = 'Brak znaków w filtrze';
        return;
      }

      quizAnswered = false;
      document.getElementById('quizFeedback').textContent = '';
      document.getElementById('quizFeedback').className = 'feedback';

      currentQuizItem = data[Math.floor(Math.random() * data.length)];
      const charEl = document.getElementById('quizChar');
      charEl.style.animation = 'none';
      charEl.offsetHeight;
      charEl.style.animation = '';
      charEl.textContent = currentQuizItem.char;

      const type = document.querySelector('input[name="quizType"]:checked').value;

      if (type === 'choice') {
        document.getElementById('quizChoice').classList.remove('hidden');
        document.getElementById('quizType').classList.add('hidden');
        renderQuizOptions(data);
      } else {
        document.getElementById('quizChoice').classList.add('hidden');
        document.getElementById('quizType').classList.remove('hidden');
        document.getElementById('quizInput').value = '';
        document.getElementById('quizInput').focus();
      }
      updateQuizStats();
    }

    function renderQuizOptions(data) {
      const container = document.getElementById('quizChoice');
      container.innerHTML = '';
      let options = [currentQuizItem.romaji];
      const others = data.filter(d => d.romaji !== currentQuizItem.romaji);
      shuffle(others).slice(0, 3).forEach(o => options.push(o.romaji));
      options = shuffle(options);

      options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'quiz-option';
        btn.textContent = opt;
        btn.onclick = () => checkChoice(opt, btn);
        container.appendChild(btn);
      });
    }

    function checkChoice(selected, btn) {
      if (quizAnswered) return;
      quizAnswered = true;
      const correct = selected === currentQuizItem.romaji;
      markHard(currentQuizItem.romaji, !correct);

      if (correct) {
        quizCorrect++;
        btn.classList.add('correct');
        document.getElementById('quizFeedback').textContent = '✓ Poprawnie!';
        document.getElementById('quizFeedback').className = 'feedback ok';
      } else {
        quizWrong++;
        btn.classList.add('wrong');
        document.querySelectorAll('.quiz-option').forEach(b => {
          if (b.textContent === currentQuizItem.romaji) b.classList.add('correct');
        });
        document.getElementById('quizFeedback').textContent = '✗ Poprawna: ' + currentQuizItem.romaji;
        document.getElementById('quizFeedback').className = 'feedback bad';
      }
      updateQuizStats();
    }

    function checkType() {
      if (quizAnswered) return;
      const input = document.getElementById('quizInput').value.trim().toLowerCase();
      if (!input) return;
      quizAnswered = true;
      const correct = input === currentQuizItem.romaji;
      markHard(currentQuizItem.romaji, !correct);

      if (correct) {
        quizCorrect++;
        document.getElementById('quizFeedback').textContent = '✓ Poprawnie!';
        document.getElementById('quizFeedback').className = 'feedback ok';
      } else {
        quizWrong++;
        document.getElementById('quizFeedback').textContent = '✗ Poprawna: ' + currentQuizItem.romaji;
        document.getElementById('quizFeedback').className = 'feedback bad';
      }
      updateQuizStats();
    }

    function updateQuizStats() {
      document.getElementById('quizCorrect').textContent = quizCorrect;
      document.getElementById('quizWrong').textContent = quizWrong;
      const total = quizCorrect + quizWrong;
      document.getElementById('quizTotal').textContent = total;
      const pct = total === 0 ? 0 : Math.round((quizCorrect / total) * 100);
      document.getElementById('quizProgress').style.width = pct + '%';
    }

    function resetQuiz() {
      quizCorrect = 0;
      quizWrong = 0;
      updateQuizStats();
      nextQuiz();
    }

    let canvas, ctx, drawing = false, lastX = 0, lastY = 0;

    function initWrite() {
      writeDeck = shuffle(getFilteredData());
      writeIndex = 0;
      if (writeDeck.length === 0) {
        document.getElementById('writeChar').textContent = '–';
        document.getElementById('writeRomaji').textContent = 'Brak znaków';
        document.getElementById('writeTotal').textContent = '0';
        return;
      }
      showWriteChar();
      setupCanvas();
    }

    function showWriteChar() {
      if (writeDeck.length === 0) return;
      const item = writeDeck[writeIndex];
      document.getElementById('writeChar').textContent = item.char;
      document.getElementById('writeRomaji').textContent = item.romaji;
      document.getElementById('writeIndex').textContent = writeIndex + 1;
      document.getElementById('writeTotal').textContent = writeDeck.length;
      clearCanvas();
    }

    function setupCanvas() {
      canvas = document.getElementById('writeCanvas');
      ctx = canvas.getContext('2d');
      ctx.strokeStyle = '#f0c4d0';
      ctx.lineWidth = 5;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      canvas.onmousedown = (e) => { drawing = true; [lastX, lastY] = getPos(e); };
      canvas.onmousemove = (e) => {
        if (!drawing) return;
        const [x, y] = getPos(e);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        [lastX, lastY] = [x, y];
      };
      canvas.onmouseup = () => drawing = false;
      canvas.onmouseleave = () => drawing = false;

      canvas.ontouchstart = (e) => {
        e.preventDefault();
        drawing = true;
        [lastX, lastY] = getPos(e.touches[0]);
      };
      canvas.ontouchmove = (e) => {
        e.preventDefault();
        if (!drawing) return;
        const [x, y] = getPos(e.touches[0]);
        ctx.beginPath();
        ctx.moveTo(lastX, lastY);
        ctx.lineTo(x, y);
        ctx.stroke();
        [lastX, lastY] = [x, y];
      };
      canvas.ontouchend = () => drawing = false;
    }

    function getPos(e) {
      const rect = canvas.getBoundingClientRect();
      const scaleX = canvas.width / rect.width;
      const scaleY = canvas.height / rect.height;
      return [(e.clientX - rect.left) * scaleX, (e.clientY - rect.top) * scaleY];
    }

    function clearCanvas() {
      if (!ctx) return;
      ctx.clearRect(0, 0, canvas.width, canvas.height);
    }

    function switchMode(mode) {
      currentMode = mode;
      document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
      document.getElementById('chartView').classList.toggle('hidden', mode !== 'chart');
      document.getElementById('flashView').classList.toggle('hidden', mode !== 'flashcards');
      document.getElementById('quizView').classList.toggle('hidden', mode !== 'quiz');
      document.getElementById('writeView').classList.toggle('hidden', mode !== 'write');
      refreshCurrentMode();
    }

    function switchCategory(cat) {
      currentCat = cat;
      activeRows = new Set(['all']);
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === cat));
      renderRowFilters();
      refreshCurrentMode();
    }

    function enterScript(script) {
      currentScript = script;
      document.getElementById('startScreen').classList.add('hidden');
      document.getElementById('mainApp').classList.add('visible');
      document.getElementById('scriptLabel').textContent = script === 'hiragana' ? 'Hiragana  ひらがな' : 'Katakana  カタカナ';
      currentCat = 'basic';
      activeRows = new Set(['all']);
      document.querySelectorAll('.cat-tab').forEach(t => t.classList.toggle('active', t.dataset.cat === 'basic'));
      renderRowFilters();
      switchMode('chart');
    }

    function goBack() {
      document.getElementById('mainApp').classList.remove('visible');
      document.getElementById('startScreen').classList.remove('hidden');
    }

    document.querySelectorAll('.choice-card').forEach(card => {
      card.onclick = () => enterScript(card.dataset.script);
    });

    document.getElementById('backBtn').onclick = goBack;

    const fontToggle = document.getElementById('fontToggle');
    if (savedFont) fontToggle.checked = true;
    fontToggle.onchange = (e) => {
      if (e.target.checked) {
        document.body.classList.add('use-jp-font');
        localStorage.setItem('hk_jp_font', '1');
      } else {
        document.body.classList.remove('use-jp-font');
        localStorage.setItem('hk_jp_font', '0');
      }
    };

    document.querySelectorAll('.mode-tab').forEach(btn => {
      btn.onclick = () => switchMode(btn.dataset.mode);
    });

    document.querySelectorAll('.cat-tab').forEach(btn => {
      btn.onclick = () => switchCategory(btn.dataset.cat);
    });

    document.getElementById('flashcard').onclick = () => {
      document.getElementById('flashcard').classList.toggle('flipped');
    };
    document.getElementById('flashNext').onclick = () => {
      if (flashDeck.length === 0) return;
      flashIndex = (flashIndex + 1) % flashDeck.length;
      showFlashcard();
    };
    document.getElementById('flashPrev').onclick = () => {
      if (flashDeck.length === 0) return;
      flashIndex = (flashIndex - 1 + flashDeck.length) % flashDeck.length;
      showFlashcard();
    };
    document.getElementById('flashShuffle').onclick = () => initFlashcards();
    document.getElementById('flashSpeak').onclick = () => {
      if (flashDeck[flashIndex]) speak(flashDeck[flashIndex].char);
    };
    document.getElementById('showRomajiFirst').onchange = () => showFlashcard();

    document.getElementById('quizNext').onclick = () => nextQuiz();
    document.getElementById('quizReset').onclick = () => resetQuiz();
    document.getElementById('quizCheck').onclick = () => checkType();
    document.getElementById('quizSpeak').onclick = () => {
      if (currentQuizItem) speak(currentQuizItem.char);
    };
    document.getElementById('quizInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') checkType();
    });
    document.querySelectorAll('input[name="quizType"]').forEach(r => {
      r.onchange = () => nextQuiz();
    });

    document.getElementById('writeClear').onclick = () => clearCanvas();
    document.getElementById('writeNext').onclick = () => {
      if (writeDeck.length === 0) return;
      writeIndex = (writeIndex + 1) % writeDeck.length;
      showWriteChar();
    };
    document.getElementById('writeShuffle').onclick = () => initWrite();
    document.getElementById('writeSpeak').onclick = () => {
      if (writeDeck[writeIndex]) speak(writeDeck[writeIndex].char);
    };
  </script>
</body>
</html>
